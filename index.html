<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Britain Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Overpass:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen game. Sky band at top (region + grid), letter wheel anchored at bottom. Single deliberate look: dusk sky per region. */
:root{
  --ink:#10162b;
  --tile:#ffffff;
  --tile-empty:rgba(255,255,255,.22);
  --gold:#ffd100;
  --gold-deep:#8a6a00;
  --wheel:#ffffff;
  --sel:#d4202f;
  --sky1:#2f5d8a; --sky2:#e9a66b;
  --panel:#ffffff;
  --muted:#5b6478;
  --f-display:"Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-ui:"Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--sky1);color:var(--ink);font-family:var(--f-ui);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{
  position:relative;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sky1) 0%,color-mix(in oklab,var(--sky1) 45%,var(--sky2)) 55%,var(--sky2) 100%);
  transition:background .6s;
}
.scene{position:absolute;inset:auto 0 0 0;height:42%;pointer-events:none;opacity:.55}
.screen{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.screen[hidden]{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;color:#fff;min-height:44px}
.bar .title{flex:1;min-width:0;text-align:center;line-height:1.1}
.bar .title b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.01em;text-wrap:balance}
.bar .title small{font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:focus-visible,.btn:focus-visible,.tool:focus-visible{outline:3px solid #fff;outline-offset:2px}
.coins{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:6px 12px 6px 6px;font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--gold) 55%,var(--gold-deep));box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block;flex:none}

/* grid */
.board{flex:1;min-height:0;display:grid;place-items:center;padding:8px 0}
.grid{position:relative}
.cell{position:absolute;border-radius:50%;background:var(--tile-empty);display:grid;place-items:center;
  font-weight:900;color:var(--ink);text-transform:uppercase;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.cell.on{background:var(--tile);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.cell.on span{animation:pop .35s ease-out both}
.cell.hint span{color:var(--gold-deep)}
.cell.flash{animation:flash .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes flash{50%{background:#ffe08a}}

/* preview */
.preview{height:46px;display:flex;justify-content:center;align-items:center}
.preview .pill{background:var(--sel);color:#fff;font-weight:900;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 16px;border-radius:12px;min-width:20px;text-align:center}
.preview .pill.ok{background:#2e9b63}
.preview .pill.bonus{background:var(--gold-deep)}
.preview .pill.dup{background:#7a849a}
.preview .pill.bad{animation:shake .4s}
.toast{color:#fff;font-weight:800;font-size:.95rem;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* wheel row */
.play{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:end;gap:6px}
.tools{display:flex;flex-direction:column;gap:12px;align-items:center}
.tool{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tool .cost{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.68rem;font-weight:900;border-radius:99px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tool .badge{position:absolute;top:-4px;right:-4px;background:var(--sel);color:#fff;font-size:.7rem;font-weight:900;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.meter{position:absolute;left:4px;right:4px;bottom:4px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.wheel{position:relative;justify-self:center;width:min(78vw,300px,38vh);aspect-ratio:1;max-width:100%;touch-action:none;cursor:pointer}
.wheel .disc{position:absolute;inset:0;border-radius:50%;background:var(--wheel);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  font-weight:900;color:var(--ink);text-transform:uppercase;transition:background .12s,color .12s,left .35s,top .35s}
.letter.sel{background:var(--sel);color:#fff}

/* home */
.home{justify-content:center;align-items:center;text-align:center;gap:18px;color:#fff}
.logo{font-family:var(--f-display);font-size:clamp(2.3rem,11vw,4rem);line-height:.95;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.logo span{display:block;font-family:var(--f-ui);font-weight:900;font-size:.3em;letter-spacing:.32em;text-transform:uppercase;margin-top:10px;opacity:.9}
.flag{border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.8);margin-bottom:-6px}
.ukmap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:-4px 0}
.ukmap svg{height:min(17vh,150px);width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.ukmap small{font-weight:800;font-size:.78rem;letter-spacing:.06em;opacity:.95}
.home{gap:12px!important}
@media (max-height:800px){.tagline{display:none}}
@media (max-height:660px){.ukmap svg{height:min(14vh,110px)}.btn{padding:10px 18px!important}.btn.primary{padding:13px!important}.menu{gap:8px!important}}
.tagline{max-width:30ch;margin:0 auto;font-weight:700;opacity:.92;line-height:1.4}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-family:var(--f-ui);font-weight:900;font-size:1.05rem;cursor:pointer;
  background:var(--tile);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary{background:var(--gold);font-size:1.25rem;padding:18px}
.btn small{font-weight:700;opacity:.7;font-size:.8rem}
.btn[disabled]{opacity:.55;cursor:default}

/* trail */
.trail{overflow-y:auto;flex:1;min-height:0;padding:8px 0 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.stop{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.9);border-radius:16px;padding:10px 14px;border:0;font-family:var(--f-ui);text-align:left;color:var(--ink);cursor:pointer}
.stop[disabled]{background:rgba(255,255,255,.35);color:rgba(29,36,51,.6);cursor:default}
.stop .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.stop b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;display:block}
.stop small{font-size:.75rem;font-weight:700;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(29,36,51,.15)}
.dots i.done{background:#2e9b63}

/* overlay */
.overlay{position:absolute;inset:0;background:rgba(15,20,32,.55);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.overlay[hidden]{display:none!important}
.card{background:var(--panel);border-radius:22px;padding:22px 20px;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.card h2{font-family:var(--f-display);font-weight:800;font-size:2rem;margin:0 0 6px;text-wrap:balance}
.card p{line-height:1.45;margin:8px 0;color:var(--muted);font-weight:600}
.card .reward{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:1.3rem;margin:8px 0 14px}
.postcard{margin:14px 0;border-radius:14px;padding:16px;text-align:left;color:#fff;position:relative;overflow:hidden}
.postcard small{font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;opacity:.9}
.postcard b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:2px 0 6px}
.postcard p{color:#fff;margin:0;font-weight:700}
.stamp{position:absolute;right:12px;top:12px;width:46px;height:54px;border:2px dashed rgba(255,255,255,.7);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem}
.bonus-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.bonus-list span{background:#f1ecdf;border-radius:8px;padding:4px 9px;font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em}
.card .btn{width:100%;margin-top:8px}
.rules{text-align:left;color:var(--muted);font-weight:600;line-height:1.5;padding-left:20px;margin:8px 0}
.rules li{margin:4px 0}

.stop .n.done{box-shadow:0 0 0 3px #2e9b63}
.stop .prog{font-weight:900;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prov{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;border:0;font-family:var(--f-ui);text-align:left;color:var(--ink);cursor:pointer}
.prov[disabled]{background:rgba(255,255,255,.35);color:rgba(29,36,51,.55);cursor:default}
.prov .sig{width:44px;height:32px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.06em;font-size:.85rem}
.prov[disabled] .sig{background:rgba(29,36,51,.35)}
.prov b{font-weight:900;font-size:1rem;display:block}
.prov small{font-size:.72rem;font-weight:700;color:var(--muted)}
.prov .st{font-weight:900;color:#2e9b63;font-size:1.1rem}
.prov.bonus{background:linear-gradient(135deg,#ffe08a,var(--gold));}
.prov.bonus .sig{background:var(--gold-deep)}
.prov.bonus[disabled]{background:rgba(255,224,138,.4)}
.region-head{color:#fff;text-align:center;padding:4px 0 6px}
.region-head p{margin:2px 0 0;font-weight:700;opacity:.9;font-size:.9rem}
.chest{font-size:0;width:64px;height:52px;margin:6px auto 2px;position:relative}
.chest::before{content:"";position:absolute;inset:18px 4px 0;border-radius:6px;background:linear-gradient(#a8642a,#7b4419);box-shadow:inset 0 0 0 3px #f2b632}
.chest::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:18px;border-radius:14px 14px 4px 4px;background:linear-gradient(#c27a35,#9a5522);box-shadow:inset 0 0 0 3px #f2b632;transform-origin:bottom left;animation:lid .7s .2s ease-out both}
@keyframes lid{to{transform:rotate(-24deg) translateY(-4px)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0;text-align:left}
.album .postcard{margin:0;padding:12px;min-height:90px}
.album .postcard b{font-size:1.05rem}
.album .postcard p{font-size:.78rem;font-weight:700}
.album .locked{background:#e9e6df;color:#8a8f9c;border-radius:14px;padding:12px;font-weight:800;display:grid;place-items:center;min-height:90px;text-align:center;font-size:.85rem}
.btn.hunt{background:linear-gradient(135deg,#2a2350,#5b3a8a);color:#fff}
.btn.hunt small{opacity:.85}
.cell.tok{box-shadow:inset 0 0 0 2.5px var(--gold)}
.cell.tok::after{content:"";position:absolute;top:12%;right:12%;width:22%;height:22%;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.cell.got{animation:got .7s}
@keyframes got{40%{background:var(--gold);transform:scale(1.15)}}
.hunt-card{background:linear-gradient(180deg,#1b1733,#2c2450 60%,#171329);color:#fff;text-align:center}
.hunt-card h2{color:#fff;letter-spacing:.02em}
.hunt-card p{color:rgba(255,255,255,.8)}
.hunt-time{display:inline-flex;gap:6px;align-items:center;font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:99px;padding:4px 14px;margin:4px 0 8px}
.hunt-theme{font-family:var(--f-display);font-size:1.6rem;margin:10px 0 2px;color:#ffd66b}
.hwords{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:center;margin:14px 0}
.hword{display:flex;gap:4px}
.hword i{width:24px;height:28px;border-radius:6px;background:#8d8a9c;display:grid;place-items:center;font-style:normal;font-weight:900;text-transform:uppercase;color:var(--ink);font-size:.95rem}
.hword i.on{background:var(--gold)}
.hword.done i{background:#7fd1a1}
.hbar{position:relative;height:26px;border-radius:99px;background:#0d0b18;border:2px solid #fff;margin:18px 30px 14px 0}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#f2b632,#ffd66b);transition:width .4s}
.hbar .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.hbar .ms{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#0d0b18;border:2px solid #fff;display:grid;place-items:center;font-size:.6rem;font-weight:900}
.hbar .ms.ok{background:#2e9b63}
.hbar .gift{position:absolute;right:-30px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:8px;background:#b54be0;box-shadow:inset 0 0 0 0 transparent}
.hbar .gift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:var(--gold)}
.hbar .gift::after{content:"";position:absolute;left:0;right:0;top:14px;height:7px;background:var(--gold)}
.hbar .gift.ok{background:#2e9b63}
.hunt-rew{font-size:.8rem;color:rgba(255,255,255,.75);font-weight:700}
.hunt-card .btn.primary{background:#19c6e0;color:#08303a}
.cityinfo{text-align:left;margin:12px 0;border-radius:16px;background:#f3f1ec;overflow:hidden}
.cityinfo .map{background:#dbe7f0;display:flex;justify-content:center;padding:10px 0 4px}
.cityinfo .map svg{height:210px;width:auto;max-width:100%}
.cityinfo .txt{padding:12px 14px 14px}
.cityinfo small{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.66rem;color:var(--muted)}
.cityinfo b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.45rem;margin:2px 0 4px;color:var(--ink)}
.cityinfo p{margin:0;color:#3a4152;font-weight:600;font-size:.92rem;line-height:1.5;text-align:left}
.cityinfo .where{margin-top:8px;font-size:.8rem;color:var(--muted)}
.provrow{display:flex;gap:8px;align-items:stretch}
.provrow .prov{flex:1;min-width:0}
.infobtn{flex:none;width:52px;border:0;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--f-display);font-size:1.3rem;cursor:pointer}
@keyframes ping{0%{r:14;opacity:.8}100%{r:46;opacity:0}}
.ping{animation:ping 1.6s ease-out infinite}
.viewmode .wheel{opacity:.35;pointer-events:none}
.viewmode #shuffleBtn,.viewmode #hintBtn,.viewmode #rocketBtn{opacity:.35;pointer-events:none}
.preview .btn.replay{padding:8px 18px;font-size:.95rem;width:auto}
.bonus-tag{display:inline-block;background:var(--gold);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:900;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}

/* v2 */
/* ===== Road-sign look: flat panels, survey grid, roundel wheel ===== */
.app{background-color:var(--sky1);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px}
.scene{display:none}
.bar{border-bottom:3px solid var(--sky2);padding-bottom:8px}
.bar .title b{font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em}
.bar .title small{letter-spacing:.2em;color:var(--sky2);opacity:1}
.icon-btn{border-radius:8px;background:#fff;color:var(--ink)}
.coins{border-radius:8px;background:#fff;color:var(--ink);padding:6px 12px 6px 8px}
.coin{background:var(--gold);box-shadow:inset 0 0 0 3px #e6b800,inset 0 0 0 5px rgba(0,0,0,.18)}
.cell{border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.cell.on{background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.cell.on span{font-family:var(--f-display);font-weight:800}
.cell.hint span{color:#b3261e}
.cell.tok{box-shadow:inset 0 0 0 3px var(--gold)}
.preview .pill{border-radius:6px;font-family:var(--f-display);font-weight:800}
.wheel .disc{background:#fff;box-shadow:inset 0 0 0 11px #d4202f,0 8px 0 rgba(0,0,0,.28)}
.letter{font-family:var(--f-display);font-weight:800}
.letter.sel{background:#1c3f94;color:#fff}
.tool{border-radius:10px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tool .cost{border-radius:4px;background:var(--gold);color:var(--ink)}
.logo{font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:.86;font-size:clamp(3.4rem,17vw,5.6rem);text-shadow:none}
.logo span{display:inline-block;background:#fff;color:var(--ink);padding:6px 12px;border-radius:5px;letter-spacing:.16em;font-size:.2em;margin-top:14px;opacity:1}
.flag{border-radius:3px}
.tagline{opacity:1;font-weight:600}
.btn{border-radius:8px;background:rgba(0,0,0,.3);color:#fff;box-shadow:inset 0 0 0 2.5px #fff,0 4px 0 rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:.95rem}
.btn:active{box-shadow:inset 0 0 0 2.5px #fff,0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--gold);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink),0 4px 0 rgba(0,0,0,.35);font-size:1.3rem}
.btn.hunt{background:#1b1733;color:#fff}
.card .btn,.hunt-card .btn{box-shadow:inset 0 0 0 2.5px currentColor,0 4px 0 rgba(0,0,0,.2)}
.card .btn:not(.primary):not(.hunt){background:#fff;color:var(--ink)}
.stop,.prov,.infobtn{border-radius:8px;background:#fff}
.stop[disabled],.prov[disabled]{background:rgba(255,255,255,.28)}
.stop .n{border-radius:6px;font-family:var(--f-display);font-size:1.2rem}
.stop b,.prov b{font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em}
.prov .sig{border-radius:4px;background:#1c3f94;font-family:var(--f-display);font-size:1rem}
.prov.bonus{background:var(--gold)}
.prov.bonus .sig{background:var(--ink)}
.card{border-radius:12px;border-top:10px solid var(--gold)}
.card h2{font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:2.2rem}
.postcard{border-radius:6px}
.postcard b{text-transform:uppercase;letter-spacing:.03em}
.album .postcard,.album .locked,.cityinfo,.bonus-list span{border-radius:6px}
.cityinfo b{text-transform:uppercase;letter-spacing:.03em}
.bonus-tag{border-radius:4px}

const REGIONS = [{"n": "London & the South East", "c": ["#2b3f66", "#e0a070"], "p": [["London", "LON"], ["Windsor", "WIN"], ["Oxford", "OXF"], ["Canterbury", "CAN"], ["Brighton", "BRI"], ["Dover", "DOV"], ["St Albans", "SAB"], ["Rochester", "ROC"]], "f": "Dover's white cliffs are made of chalk and rise about 100 metres above the English Channel."}, {"n": "The South Coast", "c": ["#1f5c7a", "#f0b46c"], "p": [["Portsmouth", "POR"], ["Southampton", "SOU"], ["Winchester", "WCH"], ["Salisbury", "SAL"], ["Chichester", "CHI"], ["Bournemouth", "BOU"]], "f": "HMS Victory, launched in 1765, is the oldest naval ship in the world still in commission."}, {"n": "The West Country", "c": ["#3b4a63", "#e8b48a"], "p": [["Bath", "BAT"], ["Bristol", "BRS"], ["Gloucester", "GLO"], ["Wells", "WEL"], ["Exeter", "EXE"], ["Plymouth", "PLY"], ["Truro", "TRU"], ["Penzance", "PEN"]], "f": "Cornwall has its own flag, a white cross on black, for St Piran, the patron saint of tin miners."}, {"n": "The Midlands", "c": ["#4a3d63", "#d9a06c"], "p": [["Stratford-upon-Avon", "STR"], ["Birmingham", "BIR"], ["Coventry", "COV"], ["Leicester", "LEI"], ["Nottingham", "NOT"], ["Lincoln", "LIN"], ["Worcester", "WOR"], ["Derby", "DBY"], ["Hereford", "HER"]], "f": "No place in England is farther from the sea than Coton in the Elms, in Derbyshire, about 70 miles from the coast."}, {"n": "East of England", "c": ["#355a63", "#e6c079"], "p": [["Cambridge", "CAM"], ["Ely", "ELY"], ["Norwich", "NOR"], ["Ipswich", "IPS"], ["Colchester", "COL"], ["Peterborough", "PET"]], "f": "Holme Fen, in the Fens, is the lowest land in Great Britain, about 2.75 metres below sea level."}, {"n": "The North West", "c": ["#33506b", "#d99a7a"], "p": [["Chester", "CHE"], ["Liverpool", "LIV"], ["Manchester", "MAN"], ["Lancaster", "LAN"], ["Carlisle", "CAR"], ["Blackpool", "BLA"], ["Preston", "PRE"]], "f": "Scafell Pike, in the Lake District, is the highest mountain in England at 978 metres."}, {"n": "Yorkshire & the North East", "c": ["#2 const CITY = {"LON": ["London", "The capital of the United Kingdom, London sits on the River Thames. Big Ben, Tower Bridge, the Tower of London and Buckingham Palace attract millions of visitors. Its Underground, opened in 1863, is the oldest metro system in the world, and hundreds of languages are spoken in its streets.", "In south-east England, on the River Thames.", "England"], "WIN": ["Windsor", "Windsor Castle is the oldest and largest inhabited castle in the world, and has been a royal home for almost a thousand years. Across the river is Eton College, the famous school where many prime ministers studied. The Great Park nearby has deer roaming free.", "West of London, on the River Thames.", "England"], "OXF": ["Oxford", "Known as the city of dreaming spires, Oxford has the oldest university in the English-speaking world, with teaching since about 1096. Its colleges, the Bodleian Library and the round Radcliffe Camera fill the streets. Christ Church was used as a film location for Harry Potter.", "In central southern England, about 60 miles north-west of London.", "England"], "CAN": ["Canterbury", "Canterbury Cathedral is the mother church of the Anglican Communion and the seat of the Archbishop of Canterbury. Pilgrims have walked here since Thomas Becket was killed in 1170, a journey made famous by Chaucer in The Canterbury Tales. The old city walls still surround the centre.", "In Kent, in the south-east corner of England.", "England"], "BRI": ["Brighton", "A lively seaside city, Brighton is known for its pebble beach, the Palace Pier and the Royal Pavilion, a palace in Indian style built for the Prince Regent. Narrow lanes called The Lanes are full of little shops, and the city has a famous creative, festival-loving spirit.", "On the south coast, about 50 miles south of London.", "England"], "DOV": ["Dover", "Dover is the busiest ferry port in Europe, facing France across the Strait of Dover, only about 21 miles wide. The white cliffs are a symbol of home for travellers, and the medieval castle above the town has guarded the coast for nearly nine centuries.", "On the south-east coast of Kent, facing France.", "England"], "SAB": ["St Albans", "St Albans was the Roman city of Verulamium, and is named after Alban, said to be the first British martyr. Its great Norman cathedral, partly built with reused Roman bricks, has one of the longest naves in England. Roman walls and a Roman theatre can still be visited.", "In Hertfordshire, about 20 miles north of London.", "England"], "ROC": ["Rochester", "Rochester has one of the best-preserved Norman castles in England, with a keep about 34 metres high above the River Medway. Its cathedral, founded in 604, is the second oldest in England. Charles Dickens lived nearby and set scenes of several of his books here.", "In Kent, on the River Medway.", "England"], "POR": ["Portsmouth", "Britain's famous naval city is home to the Historic Dockyard, where you can step aboard HMS Victory, Nelson's flagship at Trafalgar, and see the Mary Rose, Henry VIII's warship raised from the sea in 1982. The writer Charles Dickens was born here in 1812.", "On the south coast, on Portsea Island.", "England"], "SOU": ["Southampton", "A major port, Southampton is where the Titanic set sail on her only voyage in April 1912. Today its docks welcome some of the largest cruise ships in the world. Parts of the medieval town walls and the Tudor House still stand in the old quarter.", "On the south coast, at the head of Southampton Water.", "England"], "WCH": ["Winchester", "Winchester was the capital of King Alfred the Great's kingdom of Wessex. Its cathedral has one of the longest naves in Europe and holds the tomb of the novelist Jane Austen. In the Great Hall hangs a huge round table linked with the legend of King Arthur.", "In Hampshire, in southern England.", "England"], "SAL": ["Salisbury", "Salisbury Cathedral has the tallest church spire in Britain, about 123 metres high, and keeps one of the four surviving original copies of Magna Carta from 1215. A few miles to the north stand the great stones of Stonehenge.", "In Wiltshire, in southern England.", "England"], "CHI": ["Chichester", "A small cathedral city near the sea, Chichester still has the Roman street plan of four main streets meeting at the Market Cross. Its cathedral is the only medieval English cathedral you can see from the sea. Nearby, Fishbourne Roman Palace has the biggest Roman house found in Britain.", "On the south coast, in West Sussex.", "England"], "BOU": ["Bournemouth", "Bournemouth is a seaside resort with miles of golden sand, a pier and gardens running down to the beach. It grew in Victorian times as a healthy place for holidays, and today is popular for surfing, sunbathing and summer festivals.", "On the south coast, in Dorset.", "England"], "BAT": ["Bath", "Bath is named after the hot springs that the Romans used for bathing. Honey-coloured Georgian crescents, like the Royal Crescent, helped make the whole city a UNESCO World Heritage Site. Jane Austen lived here and set two of her novels in its streets.", "In Somerset, in south-west England.", "England"], "BRS": ["Bristol", "A great port on the River Avon, Bristol is home to Brunel's Clifton Suspension Bridge and to the SS Great Britain, once the longest passenger ship in the world. It is the city of the street artist Banksy and of the studio that makes Wallace and Gromit.", "In south-west England, on the River Avon.", "England"], "GLO": ["Gloucester", "Gloucester has a magnificent cathedral with a fan-vaulted cloister, used as the Hogwarts corridors in the Harry Potter films. Its Victorian docks, once busy with ships carrying grain, are now home to museums, shops and restaurants.", "On the River Severn, in south-west England.", "England"], "WEL": ["Wells", "With about 12,000 people, Wells is England's smallest city. Its cathedral has a famous scissor arch and a front covered in hundreds of medieval statues. Vicars' Close, begun in the 14th century, is thought to be the oldest completely medieval street in Europe.", "In Somerset, at the foot of the Mendip Hills.", "England"], "EXE": ["Exeter", "Exeter sits by the River Exe in Devon. The Romans built walls around it, and parts still stand. The cathedral has the longest unbroken medieval stone vault in the world. The old quayside, with its warehouses, is now a lively place to eat and walk.", "In Devon, on the River Exe.", "England"], "PLY": ["Plymouth", "Plymouth Sound is a great natural harbour. Sir Francis Drake sailed from here to face the Spanish Armada in 1588, and in 1620 the Pilgrim Fathers set off for America on the Mayflower. The city is still a big base for the Royal Navy.", "On the south coast of Devon.", "England"], "TRU": ["Truro", "Truro is the only city in Cornwall. Its cathedral, finished in 1910, has three tall spires that rise above the rooftops. The county around it is known for tin mines, pasties, fishing villages and wild, sea-swept coasts.", "In Cornwall, in the far south-west of England.", "England"], "PEN": ["Penzance", "Penzance is the most westerly major town in Cornwall, looking over Mount's Bay to St Michael's Mount, an island castle reached on foot at low tide. The town gave its name to Gilbert and Sullivan's comic opera The Pirates of Penzance. Boats leave from here for the Isles of Scilly.", "In Cornwall, at the far south-west tip of England.", "England"], "STR": ["Stratford-upon-Avon", "Stratford is the birthplace of William Shakespeare, born here in 1564. Visitors can see his birthplace house, Anne Hathaway's Cottage and the Royal Shakespeare Theatre by the River Avon, where his plays are still performed every year.", "In Warwickshire, in the heart of England.", "England"], "BIR": ["Birmingham", "Birmingham is the second-largest city in the UK and was a heartland of the Industrial Revolution. It has more miles of canal than Venice. The Bullring shopping centre, the Jewellery Quarter and the Cadbury story at Bournville give it a lively mix of old and new.", "In the West Midlands, in the centre of England.", "England"], "COV": ["Coventry", "Coventry was badly bombed in 1940, and the ruins of the old cathedral were kept beside the new one as a symbol of peace. The city once made cars and bicycles, and has the legend of Lady Godiva. It was UK City of Culture in 2021.", "In the West Midlands.", "England"], "LEI": ["Leicester", "In 2012 the skeleton of King Richard III was found under a car park in Leicester, and he was reburied in the cathedral. The city has the National Space Centre, one of the biggest Diwali celebrations outside India, and the football story of Leicester City's Premier League title in 2016.", "In the East Midlands.", "England"], "NOT": ["Nottingham", "Nottingham is the home of the Robin Hood legend, with the Sheriff and nearby Sherwood Forest. Ye Olde Trip to Jerusalem, one of England's oldest inns, is built into sandstone caves under the castle. The city was also long famous for lace-making.", "In the East Midlands, near Sherwood Forest.", "England"], "LIN": ["Lincoln", "On a steep hill above the River Witham, Lincoln is dominated by its huge cathedral, which was once the tallest building in the world. Lincoln Castle holds one of the four surviving copies of Magna Carta from 1215.", "In Lincolnshire, in eastern England.", "England"], "WOR": ["Worcester", "Worcester stands on the River Severn, and its cathedral holds the tomb of King John. The Battle of Worcester in 1651 ended the English Civil War. The city also gave the world Worcestershire sauce, first made here in the 1830s.", "In the West Midlands, on the River Severn.", "England"], "DBY": ["Derby", "Derby was home to one of the first factory silk mills in the world, built on the River Derwent in the early 1700s and part of a UNESCO World Heritage Site. Today the city makes Rolls-Royce aircraft engines, and Derby County play football at Pride Park.", "In the East Midlands, on the River Derwent.", "England"], "HER": ["Hereford", "Hereford sits on the River Wye near the Welsh border. Its cathedral holds the Mappa Mundi, a huge map of the world made around 1300, the largest medieval map still in existence. The county is famous for cider orchards and Hereford cattle.", "In the West Midlands, on the River Wye near the Welsh border.", "England"], "CAM": ["Cambridge", "Cambridge is a university city with colleges dating from the 13th century. Visitors glide in punts past King's College Chapel. Isaac Newton, Charles Darwin and Stephen Hawking studied or worked here, and the structure of DNA was discovered here in 1953.", "In the east of England, on the River Cam.", "England"], "ELY": ["Ely", "Rising above the flat Fens, Ely Cathedral is called the Ship of the Fens because it can be seen from miles around. Ely was once an island in the marshes, and today is one of the smallest cities in England. Oliver Cromwell once lived here.", "In the Fens, north of Cambridge.", "England"], "NOR": ["Norwich", "Norwich was one of the richest and biggest cities in medieval England. It has a Norman castle and cathedral, cobbled lanes and Norwich Market, one of the largest outdoor markets in the UK. More than 30 medieval churches still stand in the city.", "In Norfolk, in the east of England.", "England"], "IPS": ["Ipswich", "Ipswich is a port on the River Orwell and one of the oldest continuously inhabited towns in England. Cardinal Wolsey, the powerful adviser of Henry VIII, was born here, and the painter Thomas Gainsborough worked here early in his career.", "In Suffolk, on the River Orwell.", "England"], "COL": ["Colchester", "Colchester claims to be Britain's oldest recorded town. It was the first Roman capital of Britain, called Camulodunum, and was burned by Queen Boudica in AD 61. Its Norman castle keep, built on Roman foundations, is the largest in Europe.", "In Essex, in the east of England.", "England"], "PET": ["Peterborough", "Peterborough has a magnificent Norman cathedral with a painted wooden ceiling about 800 years old, and the burial place of Catherine of Aragon, the first wife of Henry VIII. Nearby, at Flag Fen, Bronze Age people built a long wooden causeway across the marshes.", "In eastern England, on the edge of the Fens.", "England"], "CHE": ["Chester", "Chester has the most complete Roman and medieval city walls in Britain, nearly two miles long. Its Rows, shops on two levels, are unique. The city sits on the River Dee and its Roodee is one of the oldest racecourses in England.", "In Cheshire, close to the border with Wales.", "England"], "LIV": ["Liverpool", "Liverpool's docks once sent ships all over the world. The city is famous for the Beatles, who began at the Cavern Club, for its football clubs Liverpool and Everton, and for the Royal Liver Building, topped by its mythical Liver Birds.", "In north-west England, on the River Mersey.", "England"], "MAN": ["Manchester", "Manchester was the world's first industrial city, with cotton mills and canals. The first computer that stored its own programs ran here in 1948. It is also home to the football clubs United and City, and a legendary music scene from The Smiths to Oasis.", "In north-west England.", "England"], "LAN": ["Lancaster", "Lancaster stands on the River Lune, with a medieval castle that served as a prison for centuries. The city gave its name to the House of Lancaster and its red rose in the Wars of the Roses. Morecambe Bay and the Lake District are a short drive away.", "In Lancashire, on the River Lune.", "England"], "CAR": ["Carlisle", "Carlisle is the biggest city in Cumbria, near the Scottish border. Hadrian's Wall once ran just to the north, and its red sandstone castle has stood for nearly 900 years. Mary, Queen of Scots, was held there in 1568.", "In Cumbria, close to the border with Scotland.", "England"], "BLA": ["Blackpool", "A famous Victorian seaside resort, Blackpool has a tower inspired by the Eiffel Tower, built in 1894, three piers and the Pleasure Beach. Every autumn the Illuminations light up the seafront for miles.", "On the Lancashire coast, facing the Irish Sea.", "England"], "PRE": ["Preston", "Preston became a city in 2002 and grew rich with cotton mills on the River Ribble. Its Guild festival, held only once every 20 years, is one of the oldest in Britain. Preston North End, a founder of the Football League, won the very first league title in 1889.", "In Lancashire, on the River Ribble.", "England"], "SHE": ["Sheffield", "Sheffield was known as Steel City because it made knives, cutlery and stainless steel. It is built on seven hills, like Rome, and is one of the greenest cities in England. The World Snooker Championship is played at the Crucible Theatre.", "In South Yorkshire.", "England"], "LEE": ["Leeds", "Leeds is the commercial heart of Yorkshire, once rich on wool and later on banking and shops. Its Victorian arcades, like the Victoria Quarter, are full of colourful glass. The Royal Armouries museum keeps the national collection of arms and armour.", "In West Yorkshire.", "England"], "YOR": ["York", "York was founded by the Romans, then ruled by Vikings, who called it Jorvik. It is surrounded by medieval walls and dominated by the huge Gothic York Minster. The Shambles, with overhanging houses, is among the best-preserved medieval streets in Europe.", "In North Yorkshire.", "England"], "HUL": ["Hull", "Officially Kingston upon Hull, this port on the Humber estuary was the home of William Wilberforce, who campaigned against the slave trade. Hull was UK City of Culture in 2017. The Deep, a striking aquarium, stands on the waterfront.", "On the Humber estuary, in East Yorkshire.", "England"], "DUR": ["Durham", "Durham Cathedral and Castle stand together on a rocky bend of the River Wear and form a UNESCO World Heritage Site. The cathedral, begun in 1093, is one of the finest Norman buildings in Europe. Durham University, founded in 1832, is among the oldest in England.", "In north-east England, on the River Wear.", "England"], "NEW": ["Newcastle", "Newcastle upon Tyne is spanned by seven bridges, including the Tyne Bridge and the tilting Millennium Bridge. It gave its name to the saying 'carrying coals to Newcastle'. Its football fans wear black and white, and the Geordie accent is among the most famous in Britain.", "In north-east England, on the River Tyne.", "England"], "BRA": ["Bradford", "Bradford was the wool capital of the world in Victorian times, and its tall mill chimneys can still be seen. It was UK City of Culture in 2025. The city is famous for its curry houses, and the National Science and Media Museum is here.", "In West Yorkshire.", "England"], "RIP": ["Ripon", "Ripon is a small cathedral city in North Yorkshire. Every night at 9pm a horn is blown in the market square, a tradition that has continued for more than 1,100 years. Nearby Fountains Abbey is one of the largest monastic ruins in Britain and a UNESCO World Heritage Site.", "In North Yorkshire.", "England"], "SCA": ["Scarborough", "Scarborough is often called Britain's first seaside resort, after visitors came in the 1600s to drink its spa waters. It has two sandy bays divided by a headland topped by a ruined castle. The writer Anne Bronte is buried here.", "On the North Yorkshire coast.", "England"], "CDF": ["Cardiff", "Cardiff became the capital of Wales in 1955. The city has a castle with Roman walls and a Victorian fairytale tower, the Senedd on the bay, and the Principality Stadium right in the centre, where rugby fans sing. Cardiff Bay was once a huge coal-exporting port.", "On the south coast of Wales.", "Wales"], "SWA": ["Swansea", "Swansea sits on a wide curved bay at the gateway to the Gower Peninsula, the first place in Britain named an Area of Outstanding Natural Beauty. The poet Dylan Thomas was born here in 1914 and called it an ugly, lovely town.", "On the south coast of Wales, by Swansea Bay.", "Wales"], "STD": ["St Davids", "St Davids, named after the patron saint of Wales, is the smallest city in Britain. Its cathedral lies in a hollow next to the ruins of the Bishop's Palace, inside the Pembrokeshire Coast National Park. Cliffs, beaches and seals nearby make it a favourite with walkers.", "In Pembrokeshire, in the far south-west of Wales.", "Wales"], "CAE": ["Caernarfon", "Caernarfon has one of the finest castles in the world, begun by Edward I in 1283. Its many-sided towers copy the walls of Constantinople. In 1969 Prince Charles was invested here as Prince of Wales. Snowdon, the highest mountain in Wales, is nearby.", "On the north-west coast of Wales.", "Wales"], "CON": ["Conwy", "Conwy is a walled town around its castle, built by Edward I in the 1280s. The town walls have 21 towers. On the quay stands the Smallest House in Great Britain, and behind the town rise the mountains of Snowdonia.", "On the north coast of Wales, at the edge of Snowdonia.", "Wales"], "NWP": ["Newport", "Newport sits on the River Usk. Its Transporter Bridge, opened in 1906, is one of the few of its kind still working in the world. The Roman fort of Caerleon is nearby, and the Celtic Manor hosted the Ryder Cup golf match in 2010.", "On the south coast of Wales, on the River Usk.", "Wales"], "WRE": ["Wrexham", "Wrexham became a city in 2022. Its football club, one of the oldest in the world, plays at the Racecourse Ground. Close by, the Pontcysyllte Aqueduct carries a canal 38 metres above the River Dee, and Chirk Castle guards the border.", "In north-east Wales, close to the English border.", "Wales"], "ABY": ["Aberystwyth", "Aberystwyth is a seaside town on Cardigan Bay in mid-Wales. Its university, founded in 1872, was the first in Wales, and the National Library of Wales stands on a hill above the town. The Cliff Railway climbs Constitution Hill for sea views.", "On the west coast of Wales, on Cardigan Bay.", "Wales"], "BRE": ["Brecon", "Brecon lies at the edge of the Brecon Beacons National Park, now also called Bannau Brycheiniog. Pen y Fan, the highest peak in southern Britain at 886 metres, is nearby. The town has a small cathedral and a famous jazz festival every summer.", "In mid-Wales, on the edge of the Brecon Beacons.", "Wales"], "EDI": ["Edinburgh", "The capital of Scotland, Edinburgh is built on ancient volcanic rock topped by Edinburgh Castle. The Royal Mile runs down to the Palace of Holyroodhouse. Every August the Fringe becomes the biggest arts festival in the world, and J. K. Rowling wrote early Harry Potter chapters in its cafes.", "In south-east Scotland, on the Firth of Forth.", "Scotland"], "GLA": ["Glasgow", "Glasgow is the biggest city in Scotland, built on the River Clyde. It grew rich on shipbuilding and trade, and is famous for the buildings of Charles Rennie Mackintosh. Its great free museums, like Kelvingrove, and a lively music scene draw visitors.", "In west-central Scotland, on the River Clyde.", "Scotland"], "STI": ["Stirling", "Stirling is called the Gateway to the Highlands. Its hilltop castle was a favourite of Scottish kings and queens. Nearby, William Wallace beat the English at Stirling Bridge in 1297, and Robert the Bruce won at Bannockburn in 1314.", "In central Scotland, on the River Forth.", "Scotland"], "SAN": ["St Andrews", "St Andrews is the home of golf, and the Old Course has been played for about 600 years. The ruins of its cathedral, once the largest in Scotland, stand by the sea. The oldest university in Scotland, founded in 1413, is here.", "On the east coast of Scotland, in Fife.", "Scotland"], "PER": ["Perth", "Perth sits on the River Tay and is known as the Fair City and the gateway to the Highlands. For centuries it was a place of Scottish kings, and nearby Scone Palace is where they were crowned on the Stone of Destiny.", "In central Scotland, on the River Tay.", "Scotland"], "DUN": ["Dundee", "Dundee is the City of Discovery, named after Captain Scott's ship RRS Discovery, built here. It was once famous for jute, jam and journalism, and it publishes the comics The Beano and The Dandy. V&A Dundee is Scotland's design museum.", "On the east coast of Scotland, on the Firth of Tay.", "Scotland"], "ABE": ["Aberdeen", "Aberdeen is the Granite City, whose grey buildings sparkle in the sun. It became the oil capital of Europe thanks to the North Sea. It has a busy harbour, golden beaches and a university founded in 1495.", "On the north-east coast of Scotland.", "Scotland"], "INV": ["Inverness", "Inverness is the capital of the Scottish Highlands, on the River Ness near the Moray Firth. Loch Ness, home of the legendary monster, lies a few miles away. Culloden Moor, where the last battle on British soil was fought in 1746, is close.", "In the north of Scotland, on the River Ness.", "Scotland"], "OBA": ["Oban", "Oban is a harbour town on the west coast of Scotland, known as the Gateway to the Isles. Ferries leave from here for Mull, Iona and the Outer Hebrides. Above the town stands McCaig's Tower, a round Victorian folly built to give work to local people.", "On the west coast of Scotland.", "Scotland"], "FTW": ["Fort William", "Fort William stands at the foot of Ben Nevis, the highest mountain in the British Isles at 1,345 metres. The Caledonian Canal starts nearby, and the Jacobite steam train, seen in the Harry Potter films, crosses the Glenfinnan Viaduct.", "In the Highlands, on the west coast of Scotland.", "Scotland"], "AYR": ["Ayr", "Ayr is a seaside town on the Firth of Clyde. Robert Burns, Scotland's national poet, was born in nearby Alloway in 1759, and every year on 25 January Scots celebrate Burns Night with haggis, songs and poems. The town also has a famous racecourse.", "On the south-west coast of Scotland, on the Firth of Clyde.", "Scotland"], "ELG": ["Elgin", "Elgin is a historic market town in Moray, in north-east Scotland. The ruins of its cathedral, once called the Lantern of the North, stand where a great church was burned in 1390. The area is the heart of Speyside whisky country.", "In Moray, in north-east Scotland.", "Scotland"], "BEL": ["Belfast", "Belfast is the capital of Northern Ireland. The Titanic was built in its shipyard, and the Titanic Belfast museum stands on the site. The huge yellow cranes Samson and Goliath are city landmarks, and the Giant's Causeway is an easy day trip.", "On the east coast of Northern Ireland, on the River Lagan.", "Northern Ireland"], "ARM": ["Armagh", "Armagh is a quiet cathedral city and the religious capital of all Ireland, with two cathedrals named after St Patrick. It has an observatory and planetarium, and is called the Orchard County for its apple blossom.", "In the south of Northern Ireland.", "Northern Ireland"], "DER": ["Derry/Londonderry", "Derry is the only completely walled city in Ireland, and you can still walk all the way around its 17th-century walls. The Peace Bridge links the two banks of the River Foyle. The city was UK City of Culture in 2013.", "In the north-west of Northern Ireland, on the River Foyle.", "Northern Ireland"], "NRY": ["Newry", "Newry lies near the border between Northern Ireland and the Republic of Ireland, on the Newry Canal, opened in 1742 and one of the first major canals in the British Isles. It became a city in 2002. The Mourne Mountains rise nearby.", "In the south of Northern Ireland, close to the border with the Republic.", "Northern Ireland"], "BNG": ["Bangor", "Bangor is a seaside city on Belfast Lough, about 13 miles east of Belfast, which gained city status in 2022. Its busy marina is a favourite for sailors. In the 6th century its abbey was an important centre of learning, and monks travelled from here across Europe.", "On the coast of Northern Ireland, on Belfast Lough.", "Northern Ireland"]};

function mapSvg(sig, ri){
  const c = CITY[sig], pt = MAP.pts[sig];
  let s = `<path d="${MAP.irl}" fill="#dfe6ec" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
  for (const [n, d] of Object.entries(MAP.nat)) s += `<path d="${d}" fill="${n === c[3] ? '#f2c97a' : '#c9d3de'}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
  REGIONS[ri].p.forEach(([nm, sg]) => { const q = MAP.pts[sg]; if (q && sg !== sig) s += `<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="#1d2433" fill-opacity=".6" stroke="#fff" stroke-width="1.5"/>`; });
  s += pt ? `<circle class="ping" cx="${pt[0]}" cy="${pt[1]}" r="14" fill="none" stroke="#e2573b" stroke-width="4"/><circle cx="${pt[0]}" cy="${pt[1]}" r="9" fill="#e2573b" stroke="#fff" stroke-width="3.5"/>` : '';
  return `<svg viewBox="${MAP.vb.join(' ')}" role="img" aria-label="Location on the map of the United Kingdom">${s}</svg>`;
}
function cityCard(idx){
  const pv = PROV[idx], r = REGIONS[pv.ri], c = CITY[pv.sig];

  return `<div class="cityinfo"><div class="map">${mapSvg(pv.sig, pv.ri)}</div>
    <div class="txt"><small>${c[3]} · ${r.n}</small><b>${c[0]}</b><p>${c[1]}</p><p class="where">${c[2]} The pin marks the city, the dark dots are the other cities of this stage.</p></div></div>`;
}

}

function currentHunt(){ const n = Date.now(); return HUNTS.find(e => e.start <= n && n < e.end) || null; }
function nextHunt(){ const n = Date.now(); return HUNTS.find(e => e.start > n) || null; }
function huntState(e){
  if (!S.hunt || S.hunt.id !== e.id) S.hunt = {id:e.id, tok:{}, count:0, ms:[]};
  return S.hunt;
}
function fmtLeft(ms){

}
const huntMs = e => [Math.round(e.total/3), Math.round(e.total*2/3), e.total];
const huntRew = e => [40 + e.days*5, 60 + e.days*8, 150 + e.days*20];

function tokenCells(){
  const e = currentHunt(); if (!e || !G || G.view) return [];
  const keys = [...G.cells.keys()].sort();
  const r = rng(hashStr(e.id + ':' + G.mode + ':' + G.idx + ':' + (G.mode==='daily'?todayKey():'')));
  const out = [];
  while (out.length < Math.min(TOKENS[G.mode], keys.length)){ const k = keys[Math.floor(r()*keys.length)]; if (!out.includes(k)) out.push(k); }
  return out;
}
function tokKey(k){ return G.mode + ':' + G.idx + ':' + (G.mode==='daily'?todayKey():'') + ':' + k; }
function collectToken(k){
  const e = currentHunt(); if (!e) return;
  const st = huntState(e);
  if (st.tok[tokKey(k)] || st.count >= e.total) return;
  st.tok[tokKey(k)] = 1; st.count++;
  const el = G.cells.get(k).el; el.classList.remove('tok'); el.classList.add('got');
  const ms = huntMs(e), rw = huntRew(e);

  ms.forEach((m, i) => { if (st.count >= m && !st.ms.includes(i)){ st.ms.push(i); S.coins += rw[i]; msg = i === 2 ? `Hunt complete! +${rw[i]} coins` : `Milestone reached: +${rw[i]} coins`; updateCoins(); } });
  save();
  setTimeout(() => setPreview('', null, msg), 700);
}
function huntCard(){
  const e = currentHunt();
  if (!e){
    const nx = nextHunt();
    openCard(`<h2>Letter hunt</h2><p>No hunt in progress.${nx ? ` The next one starts in <b>${fmtLeft(nx.start - Date.now())}</b>.` : ''}</p><button class="btn" type="button" data-act="close">Close</button>`);
    return;
  }
  const st = huntState(e), ms = huntMs(e), rw = huntRew(e);
  let left = st.count;
  const words = e.words.map(w => {
    const n = Math.max(0, Math.min(w.length, left)); left -= w.length;
    return `<div class="hword ${n===w.length?'done':''}">${[...w].map((ch,i)=>`<i class="${i<n?'on':''}">${i<n?ch:''}</i>`).join('')}</div>`;
  }).join('');
  const pct = st.count / e.total * 100;
  $('#card').classList.add('hunt-card');
  openCard(`<h2>Letter hunt</h2>
    <div class="hunt-time" id="huntTime">⏱ ${fmtLeft(e.end - Date.now())}</div>
    <div class="hunt-theme">${e.theme}</div>
    <p>During the hunt some squares in the grids carry a golden dot. When you uncover them you collect a letter and complete the hidden words.</p>
    <div class="hwords">${words}</div>
    <div class="hbar"><div class="fill" style="width:${pct}%"></div>
      <span class="ms ${st.ms.includes(0)?'ok':''}" style="left:${ms[0]/e.total*100}%">${st.ms.includes(0)?'✓':'+'+rw[0]}</span>
      <span class="ms ${st.ms.includes(1)?'ok':''}" style="left:${ms[1]/e.total*100}%">${st.ms.includes(1)?'✓':'+'+rw[1]}</span>
      <span class="lbl">${st.count}/${e.total}</span><span class="gift ${st.ms.includes(2)?'ok':''}"></span></div>
    <p class="hunt-rew">Prizes: ${rw[0]} and ${rw[1]} coins at the milestones, ${rw[2]} coins when the hunt is complete. Length: ${e.days} ${e.days===1?'day':'days'}.</p>
    ${st.count >= e.total ? '<p><b>Hunt complete!</b> Come back for the next one.</p>' : '<button class="btn primary" type="button" data-act="main">Play now</button>'}
    <button class="btn" type="button" data-act="close">Close</button>`);
}
setInterval(() => { const el = document.getElementById('huntTime'), e = currentHunt(); if (el && e) el.textContent = '⏱ ' + fmtLeft(e.end - Date.now()); if (!$('#home').hidden) refreshHunt(); }, 30000);
function refreshHunt(){
  const e = currentHunt(), b = $('#huntBtn');
  b.hidden = false;
  if (e){ const st = huntState(e); b.innerHTML = `Letter hunt <small>${st.count}/${e.total} · ${fmtLeft(e.end - Date.now())}</small>`; }
  else { const nx = nextHunt(); b.innerHTML = `Letter hunt <small>${nx ? 'in ' + fmtLeft(nx.start - Date.now()) : 'finished'}</small>`; }
}

// ---------- game ----------
let G = null;
function cellKey(r,c){ return r+','+c; }

function isDone(mode, idx){ return mode === 'main' ? idx < S.level : mode === 'bonus' ? !!S.bonusDone[idx] : false; }
function startLevel(mode, idx, opt = {}){
  const lv = mode === 'daily' ? DATA.daily[idx] : mode === 'bonus' ? DATA.bonus[idx] : DATA.levels[idx];
  const cells = new Map();
  lv.words.forEach(([w,r,c,d], wi) => {
    for (let i=0;i<w.length;i++){
      const rr = d==='V'? r+i : r, cc = d==='H'? c+i : c, k = cellKey(rr,cc);
      if (!cells.has(k)) cells.set(k, {ch:w[i], r:rr, c:cc});
    }
  });
  winShown = false;
  G = {mode, idx, lv, cells, revealed:new Set(), hinted:new Set(), found:new Set(), bonusFound:[], letters: lv.letters.split(''), view: !!opt.view, noSave: isDone(mode, idx)};
  if (G.view){ cells.forEach((_, k) => G.revealed.add(k)); lv.words.forEach((_, wi) => G.found.add(wi)); }
  const cur = S['cur_'+mode];
  if (!G.noSave && cur && cur.idx===idx && (mode!=='daily' || cur.day===todayKey())){
    cur.revealed.forEach(k => G.revealed.add(k)); (cur.hinted||[]).forEach(k=>G.hinted.add(k));
    cur.found.forEach(i => G.found.add(i)); G.bonusFound = cur.bonusFound.slice();
    if (cur.letters) G.letters = cur.letters.split('');
  }
  if (mode === 'daily'){
    setSky(['#3d2f5c','#e9926b']); $('#gTitle').textContent = 'Daily challenge';
    $('#gSub').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  } else if (mode === 'bonus'){
    const r = REGIONS[idx]; setSky(['#5a3a12', r.c[1]]);
    $('#gTitle').textContent = 'Bonus: ' + r.n; $('#gSub').textContent = `Bonus level · ${lv.words.length} words`;
  } else {
    const pv = PROV[idx], r = REGIONS[pv.ri]; setSky(r.c);
    $('#gTitle').textContent = pv.name; $('#gSub').textContent = `${r.n} · ${pv.pi+1}/${r.p.length}`;
  }
  if (G.view) $('#gSub').textContent = 'Grid completed ✓';
  else if (G.noSave) $('#gSub').textContent += ' · replay';
  $('#game').classList.toggle('viewmode', G.view);
  show('game');
  buildGrid(); buildWheel(); updateBonusUI(); setPreview('');
  if (G.view) $('#preview').innerHTML = `<button class="btn replay" type="button" data-replay>Play again</button>`;
  persistCur();
}

function persistCur(){
  if (!G || G.view || G.noSave) return;
  S['cur_'+G.mode] = {idx:G.idx, day: G.mode==='daily'? todayKey(): null, revealed:[...G.revealed], hinted:[...G.hinted], found:[...G.found], bonusFound:G.bonusFound, letters:G.letters.join('')};
  save();
}

function buildGrid(){
  const grid = $('#grid'), board = $('#board');
  grid.innerHTML = '';
  const {h,w} = G.lv;
  const bw = board.clientWidth, bh = board.clientHeight - 16;
  const gap = Math.max(h,w) > 8 ? 3 : 4;
  const size = Math.max(20, Math.min(56, Math.floor((bw - gap*(w-1))/w), Math.floor((bh - gap*(h-1))/h)));
  grid.style.width = (w*size + (w-1)*gap)+'px'; grid.style.height = (h*size + (h-1)*gap)+'px';
  const toks = tokenCells(), he = currentHunt(), huntSt = he ? huntState(he) : null;
  for (const [k, cell] of G.cells){
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.cssText = `left:${cell.c*(size+gap)}px;top:${cell.r*(size+gap)}px;width:${size}px;height:${size}px;font-size:${Math.round(size*.56)}px`;
    cell.el = el;
    if (toks.includes(k) && !(huntSt && huntSt.tok[tokKey(k)])) el.classList.add('tok');
    grid.appendChild(el);
    if (G.revealed.has(k)) reveal(k, false);
  }
}

function reveal(k, animate=true, hint=false){
  const cell = G.cells.get(k);
  G.revealed.add(k);
  if (hint) G.hinted.add(k);
  if (!cell.el.classList.contains('on')){
    cell.el.classList.add('on');
    if (G.hinted.has(k)) cell.el.classList.add('hint');
    cell.el.innerHTML = `<span style="${animate?'':'animation:none'}">${cell.ch}</span>`;
  }
  if (cell.el.classList.contains('tok')) collectToken(k);
}

function wordCells(wi){ const [w,r,c,d] = G.lv.words[wi]; return [...w].map((_,i)=> cellKey(d==='V'?r+i:r, d==='H'?c+i:c)); }
function checkWordsComplete(){ G.lv.words.forEach((_, wi) => { if (!G.found.has(wi) && wordCells(wi).every(k => G.revealed.has(k))) G.found.add(wi); }); }

function submit(word){
  if (word.length < 3){ setPreview(''); return; }
  const wi = G.lv.words.findIndex(x => x[0] === word);
  if (wi >= 0){
    const ks = wordCells(wi);
    if (G.found.has(wi)){
      setPreview(word, 'dup', 'Already found');
      ks.forEach(k => { const el = G.cells.get(k).el; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
      return;
    }
    G.found.add(wi);
    ks.forEach((k,i) => setTimeout(()=>reveal(k), i*70));
    ks.forEach(k => G.revealed.add(k));
    setPreview(word, 'ok');
    checkWordsComplete(); persistCur();
    setTimeout(checkWin, ks.length*70 + 400);
    return;
  }
  if (G.lv.bonus.includes(word)){
    if (G.bonusFound.includes(word)){ setPreview(word, 'dup', 'Bonus already found'); return; }
    G.bonusFound.push(word); S.meter++;
    let msg = 'Bonus word!';
    if (S.meter >= METER){ S.meter = 0; S.coins += METER_REWARD; msg = `Bonus complete: +${METER_REWARD} coins`; updateCoins(); }
    setPreview(word, 'bonus', msg); updateBonusUI(); persistCur();
    return;
  }
  setPreview(word, 'bad');
}

function postcard(ri){
  const r = REGIONS[ri];
  return `<div class="postcard" style="background:linear-gradient(135deg,${r.c[0]},${r.c[1]})"><span class="stamp">${ri+1}</span><small>Postcard from stage</small><b>${r.n}</b><p>${r.f}</p></div>`;
}

let winShown = false;
function checkWin(){
  if (!G || G.revealed.size < G.cells.size || winShown) return;
  winShown = true;
  let reward = 0, html;
  const bonusLine = `<p>Bonus words: ${G.bonusFound.length} of ${G.lv.bonus.length}</p>`;
  if (G.mode === 'daily'){
    const first = !S.dailyDone[todayKey()];
    reward = first ? 50 : 0;
    S.dailyDone[todayKey()] = true;
    html = `<h2>Challenge won!</h2>${reward?`<div class="reward"><i class="coin"></i>+${reward}</div>`:'<p>Come back tomorrow for a new challenge.</p>'}${bonusLine}
      <button class="btn primary" type="button" data-act="home">Back to the menu</button>`;
  } else if (G.mode === 'bonus'){
    const ri = G.idx, first = !S.bonusDone[ri];
    reward = first ? BONUS_REWARD : 0; S.bonusDone[ri] = true;
    const nextRi = ri + 1;
    html = `<span class="bonus-tag">Bonus level</span><h2>${REGIONS[ri].n} conquered!</h2>
      ${reward?`<div class="reward"><i class="coin"></i>+${reward}</div>`:''}${bonusLine}
      ${nextRi < REGIONS.length && S.level < total ? `<button class="btn primary" type="button" data-act="main">Next stage: ${REGIONS[Math.min(PROV[Math.min(S.level,total-1)].ri, REGIONS.length-1)].n}</button>` : ''}
      <button class="btn" type="button" data-act="region:${ri}">Back to the stage</button>`;
  } else {
    const pv = PROV[G.idx], r = REGIONS[pv.ri];
    const firstTime = G.idx >= S.level;
    reward = firstTime ? 10 + Math.floor(G.idx/10)*2 : 0;
    if (firstTime) S.level = G.idx + 1;
    const lastOfRegion = pv.pi === r.p.length - 1;
    const next = G.idx + 1 < total ? PROV[G.idx+1] : null;
    if (lastOfRegion && !S.chests[pv.ri]){
      const cr = chestReward(pv.ri);
      S.chests[pv.ri] = true; reward += cr;
      html = `<h2>Stage complete!</h2><div class="chest" aria-hidden="true"></div>
        <p>You opened the treasure chest of ${r.n}: <b>+${cr}</b> coins, and you unlocked the bonus level.</p>
        <div class="reward"><i class="coin"></i>+${reward}</div>
        ${cityCard(G.idx)}
        ${postcard(pv.ri)}
        <button class="btn primary" type="button" data-act="bonus:${pv.ri}">Play the bonus level</button>
        ${next ? `<button class="btn" type="button" data-act="next">Next stage: ${REGIONS[next.ri].n}</button>` : ''}
        <button class="btn" type="button" data-act="home">Menu</button>`;
    } else {
      html = `<h2>${['Well done!','Great!','Perfect!','Brilliant!'][G.idx%4]}</h2>
        <p>${pv.name} completed.</p>

        ${cityCard(G.idx)}${bonusLine}
        ${next ? `<button class="btn primary" type="button" data-act="next">${next.ri !== pv.ri ? `Next stage: ${REGIONS[next.ri].n}` : `Next city: ${next.name}`}</button>` : `<p>You have completed the word tour of Britain!</p>`}

function hint(n, cost){
  if (S.coins < cost){ setPreview('', null, 'Not enough coins'); return; }
  const hidden = [...G.cells.keys()].filter(k => !G.revealed.has(k));
  if (!hidden.length) return;
  S.coins -= cost; updateCoins();
  for (let i=0;i<n && hidden.length;i++){
    const k = hidden.splice(Math.floor(Math.random()*hidden.length),1)[0];
    G.revealed.add(k); G.hinted.add(k);
    setTimeout(()=>reveal(k, true, true), i*120);
  }
  checkWordsComplete(); persistCur();
  setTimeout(checkWin, n*120+300);
}

function updateBonusUI(){
  $('#bonusCount').textContent = G ? G.bonusFound.length : 0;
  $('#meter').style.width = (S.meter/METER*100)+'%';
}

let previewTimer;
function setPreview(word, state, msg){
  const p = $('#preview'); clearTimeout(previewTimer);
  if (!word && !msg){ p.innerHTML=''; return; }
  p.innerHTML = word ? `<span class="pill ${state||''}">${word}</span>` : `<span class="toast">${msg}</span>`;
  if (state){
    previewTimer = setTimeout(()=>{ p.innerHTML = msg && word ? `<span class="toast">${msg}</span>` : ''; if (msg && word) previewTimer = setTimeout(()=>p.innerHTML='', 1100); }, state==='bad'?450:650);
  } else if (msg){ previewTimer = setTimeout(()=>p.innerHTML='', 1400); }
}

// ---------- wheel ----------
let path = [], pointerPos = null, letterEls = [];
function buildWheel(){
  const wheel = $('#wheel');
  wheel.querySelectorAll('.letter').forEach(e => e.remove());
  letterEls = G.letters.map(ch => { const el = document.createElement('div'); el.className='letter'; el.textContent = ch; wheel.appendChild(el); return el; });
  layoutLetters();
}
function layoutLetters(){
  const n = letterEls.length, R = n <= 4 ? 30 : n <= 6 ? 33 : 35;
  const size = $('#wheel').clientWidth;
  letterEls.forEach((el, i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    el.style.left = (50 + R*Math.cos(a))+'%'; el.style.top = (50 + R*Math.sin(a))+'%';
    el.style.fontSize = Math.round(size * (n<=5 ? .13 : .115))+'px';
    el.style.width = (n<=5?26:n<=6?24:22)+'%';
  });
}
function centers(){
  const wr = $('#wheel').getBoundingClientRect();
  return letterEls.map(el => { const r = el.getBoundingClientRect(); return {x:r.left+r.width/2-wr.left, y:r.top+r.height/2-wr.top, rad:r.width/2}; });
}
function hitTest(x, y){
  const cs = centers();
  for (let i=0;i<cs.length;i++){ const dx = x-cs[i].x, dy = y-cs[i].y; if (dx*dx+dy*dy <= (cs[i].rad*.9)**2) return i; }
  return -1;
}
function drawLines(){
  const svg = $('#lines'), cs = centers();
  const size = $('#wheel').clientWidth;
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  let pts = path.map(i => `${cs[i].x},${cs[i].y}`);
  if (pointerPos && path.length) pts.push(`${pointerPos.x},${pointerPos.y}`);
  svg.innerHTML = pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="#d4202f" stroke-width="${Math.max(6,size*.03)}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>` : '';
  letterEls.forEach((el,i)=> el.classList.toggle('sel', path.includes(i)));
  if (path.length){ clearTimeout(previewTimer); $('#preview').innerHTML = `<span class="pill">${path.map(i => G.letters[i]).join('')}</span>`; }
}
function local(e){ const r = $('#wheel').getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
let dragging = false;
$('#wheel').addEventListener('pointerdown', e => {
  if (!G || G.view) return;
  const p = local(e), i = hitTest(p.x, p.y);

  drawLines(); e.preventDefault();
});
$('#wheel').addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = local(e); pointerPos = p;
  const i = hitTest(p.x, p.y);
  if (i >= 0){
    if (path.length >= 2 && path[path.length-2] === i) path.pop();
    else if (!path.includes(i)) path.push(i);
  }
  drawLines();
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  const word = path.map(i => G.letters[i]).join('');
  path = []; pointerPos = null; drawLines();
  submit(word);
}
$('#wheel').addEventListener('pointerup', endDrag);
$('#wheel').addEventListener('pointercancel', endDrag);

$('#shuffleBtn').onclick = () => {
  if (!G || G.view) return;
  const old = G.letters.join('');
  for (let t=0;t<10 && G.letters.join('')===old;t++){
    for (let i=G.letters.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [G.letters[i],G.letters[j]]=[G.letters[j],G.letters[i]]; }
  }
  letterEls.forEach((el,i)=> el.textContent = G.letters[i]);
  persistCur();
};
$('#hintBtn').onclick = () => { if (G && !G.view) hint(1, HINT); };
$('#rocketBtn').onclick = () => { if (G && !G.view) hint(4, ROCKET); };
$('#preview').addEventListener('click', e => { if (e.target.closest('[data-replay]') && G) startLevel(G.mode, G.idx); });
$('#bonusBtn').onclick = () => {
  const list = G.bonusFound.length ? `<div class="bonus-list">${G.bonusFound.map(w=>`<span>${w}</span>`).join('')}</div>` : '<p>None yet. Look for valid words that are not in the grid.</p>';
  openCard(`<h2>Bonus words</h2><p>Found ${G.bonusFound.length} of ${G.lv.bonus.length}. Every ${METER} bonus words you earn ${METER_REWARD} coins (${S.meter}/${METER}).</p>${list}<button class="btn" type="button" data-act="close">Close</button>`);
};

// ---------- overlay ----------
function openCard(html){ if (!html.includes('id="huntTime"') && !html.includes('No hunt in progress')) $('#card').classList.remove('hunt-card'); $('#card').innerHTML = html; $('#overlay').hidden = false; $('#card').scrollTop = 0; }
function closeCard(){ $('#overlay').hidden = true; }
$('#overlay').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  closeCard(); winShown = false;
  const [a, arg] = act.split(':');
  if (a==='next') startLevel('main', G.idx+1);
  if (a==='main') playMain();
  if (a==='bonus') startLevel('bonus', +arg);

  if (a==='replay') { const [m, i] = arg.split('-'); startLevel(m, +i); }
  if (a==='region') { G=null; openRegion(+arg); }
  if (a==='home') { G=null; show('home'); }
  if (a==='play') playMain();
});

function helpCard(first){

function playMain(){

  startLevel('main', S.level);
}

$('#playBtn').onclick = () => { if (!S.seenHelp){ S.seenHelp = true; save(); helpCard(true); } else playMain(); };
$('#dailyBtn').onclick = () => startLevel('daily', dailyIndex());
$('#trailBtn').onclick = () => { show('trail'); renderTrail(); };
$('#helpBtn').onclick = () => helpCard(false);
$('#huntBtn').onclick = huntCard;
$('#albumBtn').onclick = () => {
  const n = Object.keys(S.chests).length;
  openCard(`<h2>Postcard album</h2><p>${n} of ${REGIONS.length} stages completed.</p>
    <div class="album">${REGIONS.map((r,i) => S.chests[i] ? postcard(i) : `<div class="locked">${r.n}<br>to conquer</div>`).join('')}</div>
    <button class="btn" type="button" data-act="close">Close</button>`);
};
document.querySelectorAll('.back').forEach(b => b.onclick = () => {
  if (G && G.mode !== 'daily' && !$('#game').hidden){ const ri = G.mode === 'bonus' ? G.idx : PROV[G.idx].ri; G = null; openRegion(ri); }
  else { G = null; show('home'); }
});
$('#regionBack').onclick = () => { show('trail'); renderTrail(); };

function renderTrail(){
  setSky(['#2b4a6b','#d9a877']);
  const cur = PROV[Math.min(S.level, total-1)].ri;
  $('#trailList').innerHTML = REGIONS.map((r,i) => {
    const doneN = Math.max(0, Math.min(r.p.length, S.level - r.start));
    const unlocked = i <= cur || S.level >= total;
    const full = doneN === r.p.length;
    const sub = full ? (S.bonusDone[i] ? 'Stage and bonus completed' : 'Bonus level to play') : unlocked ? `${r.p.length} ${r.p.length===1?'city':'cities'}` : 'Locked';
    return `<button class="stop" type="button" data-r="${i}" ${unlocked?'':'disabled'}>
      <span class="n ${full && S.bonusDone[i] ? 'done':''}" style="background:linear-gradient(135deg,${r.c[0]},${r.c[1]})">${i+1}</span>
      <span><b>${r.n}</b><small>${sub}</small></span>
      <span class="prog">${doneN}/${r.p.length}${S.bonusDone[i]?' ★':''}</span>
    </button>`;
  }).join('');
  $('#trailList').children[cur]?.scrollIntoView?.({block:'center'});
}
$('#trailList').addEventListener('click', e => {
  const b = e.target.closest('.stop'); if (!b || b.disabled) return;
  openRegion(+b.dataset.r);
});

function openRegion(ri){
  const r = REGIONS[ri];
  setSky(r.c);
  $('#rTitle').textContent = r.n; $('#rSub').textContent = `Stage ${ri+1} of ${REGIONS.length}`;
  const rows = r.p.map(([name, sig], pi) => {
    const idx = r.start + pi, done = idx < S.level, open = idx <= S.level;
    return `<div class="provrow"><button class="prov" type="button" data-l="${idx}" ${open?'':'disabled'}>
      <span class="sig">${sig}</span>
      <span><b>${name}</b><small>${done ? 'Completed · tap to review' : open ? 'To play' : 'Locked'} · ${DATA.levels[idx].words.length} words</small></span>
      <span class="st">${done?'✓':''}</span></button>${done ? `<button class="infobtn" type="button" data-i="${idx}" aria-label="Card of ${name}">i</button>` : ''}</div>`;
  });
  const bOpen = regionDone(ri);
  rows.push(`<button class="prov bonus" type="button" data-b="${ri}" ${bOpen?'':'disabled'}>
      <span class="sig">★</span>
      <span><b>Bonus level</b><small>${S.bonusDone[ri] ? 'Completed · tap to review' : bOpen ? `${DATA.bonus[ri].words.length} words · +${BONUS_REWARD} coins` : 'Complete all the cities to unlock it'}</small></span>
      <span class="st">${S.bonusDone[ri]?'✓':''}</span></button>`);
  $('#provList').innerHTML = `<div class="region-head"><p>${r.p.length} ${r.p.length===1?'city':'cities'} · treasure chest of ${chestReward(ri)} coins${S.chests[ri]?' (opened)':''}</p></div>` + rows.join('');
  show('region');
}
$('#provList').addEventListener('click', e => {
  const inf = e.target.closest('.infobtn');
  if (inf){ openCard(`<h2>${PROV[+inf.dataset.i].name}</h2>${cityCard(+inf.dataset.i)}<button class="btn" type="button" data-act="close">Close</button>`); return; }
  const b = e.target.closest('.prov'); if (!b || b.disabled) return;
  const mode = b.dataset.b !== undefined ? 'bonus' : 'main', idx = mode === 'bonus' ? +b.dataset.b : +b.dataset.l;
  if (!isDone(mode, idx)) { startLevel(mode, idx); return; }
  const title = mode === 'bonus' ? 'Bonus: ' + REGIONS[idx].n : PROV[idx].name;
  openCard(`<h2>${title}</h2><p><b>Completed ✓</b> You have already finished this grid.</p>
    ${mode === 'main' ? cityCard(idx) : ''}
    <button class="btn primary" type="button" data-act="view:${mode}-${idx}">View the completed grid</button>
    <button class="btn" type="button" data-act="replay:${mode}-${idx}">Play again</button>
    <button class="btn" type="button" data-act="close">Close</button>`);
});

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(()=>{ if (G && !$('#game').hidden){ buildGrid(); layoutLetters(); } }, 120); });

show('home');
</script>

</body></html>
